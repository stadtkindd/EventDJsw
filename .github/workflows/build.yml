name: Windows-Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Windows-EXE bauen (Installer + Portable)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: EXE-Dateien als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: EventDJ-Windows
          path: dist/*.exe
          if-no-files-found: error

      # Automatisches Release: Gibt es zur Version aus package.json noch kein Release,
      # wird es beim Push auf main angelegt (Tag v<version>) und die EXEs werden angehängt.
      - name: Prüfen, ob für diese Version schon ein Release existiert
        id: ver
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release automatisch anlegen
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: EventDJ ${{ steps.ver.outputs.version }}
          files: dist/*.exe
          generate_release_notes: true
          body: |
            **Download:**
            - `EventDJ-Setup-${{ steps.ver.outputs.version }}.exe` – Installation (Startmenü & Desktop-Verknüpfung)
            - `EventDJ-Portable-${{ steps.ver.outputs.version }}.exe` – ohne Installation, z. B. vom USB-Stick

            Anleitung: siehe README und docs/BEDIENUNGSANLEITUNG.md.

      - name: EXE-Dateien an das Release hängen (Tag v* oder auf GitHub veröffentlichtes Release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*.exe
          generate_release_notes: ${{ github.event_name != 'release' }}
