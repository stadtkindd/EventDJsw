name: Windows-Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests
        run: npm test

      - name: Windows-EXE bauen (Installer + Portable)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: EXE-Dateien als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: EventDJ-Windows
          path: dist/*.exe
          if-no-files-found: error

      - name: EXE-Dateien an das Release hängen (Tag v* oder auf GitHub veröffentlichtes Release)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*.exe
          generate_release_notes: ${{ github.event_name != 'release' }}
